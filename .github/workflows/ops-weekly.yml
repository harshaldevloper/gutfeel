name: Ops — Weekly build & issue scan

on:
  schedule:
    - cron: "0 8 * * 1" # Monday 08:00 UTC
  workflow_dispatch:

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install & build
        run: |
          npm ci
          npm run build

      - name: Open GitHub issues summary
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN=$(gh issue list --state open --limit 100 --json number | jq length)
          echo "## Weekly ops report" >> $GITHUB_STEP_SUMMARY
          echo "- Build: **passed**" >> $GITHUB_STEP_SUMMARY
          echo "- Open GitHub issues: **${OPEN}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Next steps: triage issues, review Supabase support_tickets, check Render/Cloudflare deploys." >> $GITHUB_STEP_SUMMARY
