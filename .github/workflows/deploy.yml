name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      # Production deploy: Cloudflare Pages Git integration (connected to this repo).
      # It reads wrangler.toml (output: out/) and deploys /functions automatically.
      # To also deploy via GitHub Actions, set valid CF_API_TOKEN + CF_ACCOUNT_ID secrets
      # and uncomment the wrangler step below.

      # - uses: cloudflare/wrangler-action@v3
      #   with:
      #     apiToken: ${{ secrets.CF_API_TOKEN }}
      #     accountId: ${{ secrets.CF_ACCOUNT_ID }}
      #     command: pages deploy out --project-name=gutvista
